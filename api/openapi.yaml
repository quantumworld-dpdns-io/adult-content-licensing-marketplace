openapi: 3.1.0
info:
  title: Adult Content Licensing Marketplace API
  version: 0.3.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: OK
  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Ready
  /v1/auth/dev-token:
    post:
      operationId: issueDevToken
      parameters:
        - in: query
          name: role
          required: true
          schema: { type: string }
        - in: query
          name: tier
          required: false
          schema: { type: string }
        - in: query
          name: sub
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Token issued
  /v1/licenses:
    get:
      operationId: listLicenses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List licenses
        '401':
          description: Unauthorized
    post:
      operationId: createLicense
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: License created
        '400':
          description: Validation failed
        '403':
          description: Forbidden
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Audit events
  /v1/policy/compliance:
    get:
      operationId: getCompliancePolicy
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Compliance policy
  /v1/policy/threat-model:
    get:
      operationId: getThreatModelPolicy
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Threat model policy
