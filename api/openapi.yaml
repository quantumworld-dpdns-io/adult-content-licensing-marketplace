openapi: 3.1.0
info:
  title: Adult Content Licensing Marketplace API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: OK
  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Ready
  /v1/licenses:
    get:
      operationId: listLicenses
      parameters:
        - in: header
          name: X-Role
          required: true
          schema:
            type: string
        - in: header
          name: X-Tier
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List licenses
        '401':
          description: Unauthorized
    post:
      operationId: createLicense
      parameters:
        - in: header
          name: X-Role
          required: true
          schema:
            type: string
        - in: header
          name: X-Tier
          required: false
          schema:
            type: string
      responses:
        '201':
          description: License created
        '400':
          description: Validation failed
        '403':
          description: Forbidden
  /v1/policy/compliance:
    get:
      operationId: getCompliancePolicy
      responses:
        '200':
          description: Compliance policy
  /v1/policy/threat-model:
    get:
      operationId: getThreatModelPolicy
      responses:
        '200':
          description: Threat model policy
