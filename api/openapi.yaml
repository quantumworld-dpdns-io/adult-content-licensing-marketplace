openapi: 3.1.0
info:
  title: Adult Content Licensing Marketplace API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: OK
  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Ready
  /v1/licenses:
    get:
      operationId: listLicenses
      responses:
        '200':
          description: List licenses
    post:
      operationId: createLicense
      responses:
        '201':
          description: License created
