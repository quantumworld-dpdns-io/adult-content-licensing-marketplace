openapi: 3.1.0
info:
  title: Adult Content Licensing Marketplace API
  version: 0.3.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: OK
  /readyz:
    get:
      operationId: readyz
      responses:
        '200':
          description: Ready
  /v1/auth/dev-token:
    post:
      operationId: issueDevToken
      parameters:
        - in: query
          name: role
          required: true
          schema: { type: string }
        - in: query
          name: tier
          required: false
          schema: { type: string }
        - in: query
          name: sub
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Token issued
  /v1/licenses:
    get:
      operationId: listLicenses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List licenses
        '401':
          description: Unauthorized
    post:
      operationId: createLicense
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: License created
        '400':
          description: Validation failed
        '403':
          description: Forbidden
  /v1/licenses/{id}:
    get:
      operationId: getLicenseById
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: License
        '404':
          description: Not found
    put:
      operationId: updateLicenseById
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: License updated
        '404':
          description: Not found
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: type
          required: false
          schema: { type: string }
        - in: query
          name: entity_id
          required: false
          schema: { type: string }
        - in: query
          name: since
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: until
          required: false
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          required: false
          schema: { type: integer }
        - in: query
          name: offset
          required: false
          schema: { type: integer }
        - in: query
          name: cursor
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Audit events (total count + paged items + next_cursor)
        '400':
          description: Invalid query parameter
  /v1/metrics/latency:
    get:
      operationId: getLatencyMetrics
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Latency metrics snapshot
  /v1/policy/compliance:
    get:
      operationId: getCompliancePolicy
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Compliance policy
  /v1/policy/threat-model:
    get:
      operationId: getThreatModelPolicy
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Threat model policy
